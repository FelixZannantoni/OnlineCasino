<div class="mode-overlay" [class.active]="isOpen">
    <div class="overlay-backdrop" (click)="close()"></div>

    @if (isOpen) {
    <div class="mode-dialog">
        <!-- Close Button -->
        <button class="close-btn" (click)="close()" aria-label="Close">
            <mat-icon>close</mat-icon>
        </button>

        <!-- Header -->
        <div class="mode-header">
            <div class="icon-wrap">
                <mat-icon>casino</mat-icon>
            </div>
            <div class="header-text">
                <h2 class="mode-title">Wähle deinen Spielmodus</h2>
                <p class="mode-subtitle">Low, Middle oder High – passend zu deinem Skill</p>
            </div>
        </div>

        <!-- Mode Cards -->
        <div class="mode-body">
            <div class="mode-grid">
                @for (mode of modes; track mode.key) {
                <button
                    class="mode-card"
                    [class.selected]="selectedMode === mode.key"
                    [style.--mode-color]="mode.color"
                    (click)="chooseMode(mode.key)"
                    [attr.aria-pressed]="selectedMode === mode.key"
                >
                    <span class="mode-icon-wrap">
                        <mat-icon>{{ mode.icon }}</mat-icon>
                    </span>
                    <span class="mode-name">{{ mode.label }}</span>
                    <span class="mode-tagline">{{ mode.tagline }}</span>
                    <span class="mode-description">{{ mode.description }}</span>
                    <div class="mode-stakes">
                        <span class="stake-item">
                            <mat-icon>arrow_upward</mat-icon>
                            Min {{ mode.minBet }}
                        </span>
                        <span class="stake-item">
                            <mat-icon>arrow_downward</mat-icon>
                            Max {{ mode.maxBet }}
                        </span>
                    </div>
                    @if (selectedMode === mode.key) {
                    <span class="selected-badge">
                        <mat-icon>check_circle</mat-icon>
                    </span>
                    }
                </button>
                }
            </div>
        </div>

        <!-- Footer -->
        <div class="mode-footer">
            <button class="cancel-btn" (click)="close()">
                <mat-icon>close</mat-icon>
                Abbrechen
            </button>
            <button
                class="confirm-btn"
                [class.ready]="selectedMode !== null"
                [disabled]="selectedMode === null"
                (click)="confirmMode()"
            >
                <mat-icon>play_arrow</mat-icon>
                {{ selectedMode ? 'Spielen (' + selectedMode + ')' : 'Modus wählen' }}
            </button>
        </div>
    </div>
    }
</div>
