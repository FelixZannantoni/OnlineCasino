<div class="forgot-password-wrapper">
    <div class="forgot-password-card">

        <!-- Header -->
        <div class="card-header">
            <mat-icon class="header-icon">lock_reset</mat-icon>
            <h1>Forgot Password?</h1>
            <p>No worries! Enter your email and we'll send you reset instructions.</p>
        </div>

        <!-- Success Message -->
        @if (submitted) {
        <div class="success-message">
            <mat-icon>check_circle</mat-icon>
            <h2>Check Your Emails</h2>
            <p>We've sent password reset instructions to <strong>{{ email }}</strong></p>
            <a routerLink="/login" class="back-link">
                <mat-icon>arrow_back</mat-icon>
                Back to Login
            </a>
        </div>
        } @else {
        <!-- Form -->
        <form (ngSubmit)="onSubmit()" class="forgot-form">
            <div class="input-group">
                <mat-icon class="input-icon">mail_outline</mat-icon>
                <input type="email" placeholder="Enter your email" [(ngModel)]="email" name="email" required>
            </div>

            <button type="submit" class="shining-btn">
                Send Reset Link
            </button>
        </form>

        <!-- Back to Login -->
        <a routerLink="/login" class="back-link">
            <mat-icon>arrow_back</mat-icon>
            Back to Login
        </a>
        }

    </div>
</div>
