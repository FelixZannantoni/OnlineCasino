<header class="navbar">
    <div class="navbar_container">
        <div class="navbar_brand">
            <div class="coin-bg">
                <span class="chip chip-gold chip-1"></span>
                <span class="chip chip-red chip-2"></span>
                <span class="chip chip-blue chip-3"></span>
                <span class="chip chip-green chip-4"></span>
                <span class="chip chip-black chip-5"></span>
                <span class="chip chip-gold chip-6"></span>
                <span class="chip chip-red chip-7"></span>
            </div>
            
            <a routerLink="/home" class="brand_link">Online Casino</a>
        </div>

        <div class="navbar_center"></div>
        
        <div class="navbar_right">
            <nav class="navbar_nav">
                <ul>
                    <li><a routerLink="/club" class="nav_pill">Club</a></li>
                    <li><a routerLink="/friends" class="nav_pill">Friends</a></li>
                    <li><a routerLink="/leaderboard" class="nav_pill">Leaderboard</a></li>
                    <li><a routerLink="/shop" class="nav_pill">Shop</a></li>
                </ul>
            </nav>
        </div>

        <div class="navbar_right">
            <button class="settings_btn" (click)="toggleSettings()" aria-label="Open settings menu">
                <mat-icon class="settings-icon">settings</mat-icon>
            </button>
        </div>
        
        <div class="navbar_right">
            <button class="profile_pic" (click)="toggleProfile()" aria-label="Open profile menu">
                <img src="https://via.placeholder.com/40" alt="Profile" class="profile_image">
            </button>
        </div>
    </div>
</header>
