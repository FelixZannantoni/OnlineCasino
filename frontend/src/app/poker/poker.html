<div class="poker-wrapper">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="player-balance">
            <mat-icon>account_balance_wallet</mat-icon>
        </div>
        <div class="top-icons">
            <button routerLink="/home">
                <mat-icon>exit_to_app</mat-icon>
            </button>
        </div>
    </div>

    <!-- Poker Table -->
    <div class="poker-table">

        <!-- Pot -->
        <div class="pot">
            <mat-icon>monetization_on</mat-icon>
            <span class="pot-amount">1.250 $</span>
        </div>

        <!-- Board Cards (Royal Flush Hearts) -->
        <div class="board-cards">
            <div class="card card-hearts suit-hearts">
                <div class="card-top">
                    <span class="card-rank">10</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
                <div class="card-center suit-hearts"></div>
                <div class="card-bottom">
                    <span class="card-rank">10</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
            </div>
            <div class="card card-hearts suit-hearts">
                <div class="card-top">
                    <span class="card-rank">J</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
                <div class="card-center suit-hearts"></div>
                <div class="card-bottom">
                    <span class="card-rank">J</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
            </div>
            <div class="card card-hearts suit-hearts">
                <div class="card-top">
                    <span class="card-rank">Q</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
                <div class="card-center suit-hearts"></div>
                <div class="card-bottom">
                    <span class="card-rank">Q</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
            </div>
            <div class="card card-hearts suit-hearts">
                <div class="card-top">
                    <span class="card-rank">K</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
                <div class="card-center suit-hearts"></div>
                <div class="card-bottom">
                    <span class="card-rank">K</span>
                    <span class="card-suit suit-hearts"></span>
                </div>
            </div>
            <div class="card card-back">
            </div>
        </div>

        <!-- Player Cards (72o) -->
        <div class="player-cards">
            <div class="card card-sm player-card card-diamonds suit-diamonds"
                style="transform: rotate(-15deg);">
                <div class="card-top">
                    <span class="card-rank">7</span>
                    <span class="card-suit suit-diamonds"></span>
                </div>
                <div class="card-center suit-diamonds"></div>
                <div class="card-bottom">
                    <span class="card-rank">7</span>
                    <span class="card-suit suit-diamonds"></span>
                </div>
            </div>
            <div class="card card-sm card-clubs suit-clubs"
                style="transform: rotate(15deg);">
                <div class="card-top">
                    <span class="card-rank">2</span>
                    <span class="card-suit suit-clubs"></span>
                </div>
                <div class="card-center suit-clubs"></div>
                <div class="card-bottom">
                    <span class="card-rank">2</span>
                    <span class="card-suit suit-clubs"></span>
                </div>
            </div>
        </div>

    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="shining-btn">
            Fold
        </button>
        <button class="shining-btn">
            Check
        </button>
        <button class="shining-btn">
            Bet
        </button>
    </div>
</div>
