<div class="ai-chat-content">
    <h2>AI Chat Assistant</h2>
    <p class="subtitle">Powered by Wikipedia - Ask me anything!</p>

    <div class="chat-container">
        <div class="chat-messages" #chatMessages>
            @for (message of getChatMessages(); track message.timestamp) {
            <div class="message {{ message.type }}">
                <div class="message-bubble">
                    @if (message.type === 'bot') {
                    <mat-icon class="bot-avatar">smart_toy</mat-icon>
                    }
                    <div class="message-content">
                        <p [innerHTML]="message.text"></p>
                        <span class="message-time">{{ message.time }}</span>
                    </div>
                </div>
            </div>
            }
            @if (isTyping) {
            <div class="message bot">
                <div class="message-bubble">
                    <mat-icon class="bot-avatar">smart_toy</mat-icon>
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
            }
        </div>

        <div class="chat-input-container">
            <input type="text" [(ngModel)]="userInput" (keyup.enter)="sendMessage()"
                placeholder="Ask me anything about poker, casino, etc..." class="chat-input" [disabled]="isTyping" />
            <button (click)="sendMessage()" class="send-button" [disabled]="isTyping || !userInput.trim()">
                <mat-icon>send</mat-icon>
            </button>
        </div>
    </div>
</div>
