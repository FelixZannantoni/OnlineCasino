<div class="profile-overlay" [class.active]="isOpen">
    <!-- Backdrop -->
    <div class="overlay-backdrop" (click)="close()"></div>

    <!-- Sidebar Menu -->
    <div class="settings-menu">
        <!-- Close Button -->
        <button class="close-btn" (click)="close()" aria-label="Close menu">
            <mat-icon>close</mat-icon>
        </button>

        <!-- Menu Items -->
        <a routerLink="/developer-team" class="menu-item" (click)="close()">
            <mat-icon class="menu-icon">code</mat-icon>
            <span>Developer Team</span>
        </a>

        <a routerLink="/support" class="menu-item" (click)="close()">
            <mat-icon class="menu-icon">help_outline</mat-icon>
            <span>Support</span>
        </a>

        <a routerLink="/terms" class="menu-item" (click)="close()">
            <mat-icon class="menu-icon">description</mat-icon>
            <span>Terms of Service</span>
        </a>

        <a routerLink="/privacy-policy" class="menu-item" (click)="close()">
            <mat-icon class="menu-icon">privacy_tip</mat-icon>
            <span>Privacy Policy</span>
        </a>

        <!-- Language Toggle (UI Only - Not Functional Yet) -->
        <div class="language-toggle">
            <mat-icon class="menu-icon">language</mat-icon>
            <div class="language-options">
                <button class="lang-btn active" disabled>
                    <span class="lang-code">DE</span>
                    <span class="lang-name">Deutsch</span>
                </button>
                <button class="lang-btn" disabled>
                    <span class="lang-code">EN</span>
                    <span class="lang-name">English</span>
                </button>
            </div>
            <span class="coming-soon">Coming soon</span>
        </div>

        <!-- Logout at Bottom -->
        <div class="menu-footer">
            <a routerLink="/login" class="menu-item logout" (click)="close()">
                <mat-icon class="menu-icon">delete_forever</mat-icon>
                <span>Delete Account</span>
            </a>
        </div>
    </div>
</div>
