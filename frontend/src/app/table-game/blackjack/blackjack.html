<app-table-game game="blackjack" [balance]="balance" [pot]="pot">

    <!-- Game content: dealer cards, player cards, etc. -->
    <div game-content>
        <!-- Dealer Cards (top of table) -->
        <div class="dealer-cards">
            <!-- Placeholder – will be populated dynamically -->
            <div class="card card-back" style="width: 70px; height: 98px;"></div>
        </div>

        <!-- Player Cards (bottom of table) -->
        <div class="player-cards">
            <!-- Placeholder – will be populated dynamically -->
        </div>
    </div>

    <!-- Action Buttons -->
    <div game-actions style="display: flex; justify-content: center; gap: 15px; margin-bottom: 80px;">
        @if (true) { <!-- TODO: Implement variable if player already has 21 and automatic stand -->
            <button class="btn-hit">Hit</button>
            <button class="btn-stand">Stand</button>
            @if (true) { <!-- TODO: Implement variable if palyer has already Hit -->
                <button class="btn-double">Double</button>
            }
        }
        
    </div>

</app-table-game>
