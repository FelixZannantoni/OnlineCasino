<div class="players-container">
  @for (player of players(); track player.id) {
    <div 
      class="player-slot"
      [class.active]="player.id === currentPlayerId()"
      [class.folded]="player.folded"
    >
      <!-- Heiligenschein Effekt -->
      @if (player.id === currentPlayerId()) {
        <div class="halo"></div>
      }
      
      <!-- Profilbild -->
      <div class="player-avatar">
        @if (player.profileImage) {
          <img [src]="player.profileImage" [alt]="player.displayname || 'Player'" />
        } @else {
          <app-avatar [name]="player.displayname || player.id" [size]="80" />
        }
      </div>
      
      <!-- Spieler Info -->
      <div class="player-info">
        <div class="player-name">{{ player.displayname || 'Unknown' }}</div>
        <div class="player-balance">${{ player.balance }}</div>
        @if (player.bet > 0) {
          <div class="player-bet">Bet: ${{ player.bet }}</div>
        }
      </div>
      
      <!-- Folded Badge -->
      @if (player.folded) {
        <div class="folded-badge">FOLDED</div>
      }
    </div>
  }
</div>
