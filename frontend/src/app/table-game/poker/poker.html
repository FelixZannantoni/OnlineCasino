        <!-- Player Cards (72o) -->
        <div class="player-cards">
            <div class="card card-diamonds suit-diamonds"
                style="width: 60px; height: 84px; font-size: 12px; transform: rotate(-15deg);">
                <div class="card-top">
                    <span class="card-rank">7</span>
                    <span class="card-suit suit-diamonds"></span>
                </div>
                <div class="card-center suit-diamonds"></div>
                <div class="card-bottom">
                    <span class="card-rank">7</span>
                    <span class="card-suit suit-diamonds"></span>
                </div>
            </div>
            <div class="card card-clubs suit-clubs"
                style="width: 60px; height: 84px; font-size: 12px; transform: rotate(15deg);">
                <div class="card-top">
                    <span class="card-rank">2</span>
                    <span class="card-suit suit-clubs"></span>
                </div>
                <div class="card-center suit-clubs"></div>
                <div class="card-bottom">
                    <span class="card-rank">2</span>
                    <span class="card-suit suit-clubs"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div game-actions style="display: flex; justify-content: center; gap: 15px; margin-bottom: 80px;">
        <button class="btn-fold">Fold</button>
        <button class="btn-check">Check</button>
        <button class="btn-bet">Bet</button>
    </div>
